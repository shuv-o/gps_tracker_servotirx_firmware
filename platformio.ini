; Fleet Tracker - SIMCom A7672SA-FASE device test firmware
; Host: ESP32-S3-WROOM-1U-N16R8 (16 MB QIO flash, 8 MB OPI PSRAM)
; Console: native USB CDC (GPIO19/20)

[env:fleet_tracker]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8 module memory layout ----
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1     ; Serial = native USB CDC
    -DARDUINO_USB_MODE=1            ; USB-Serial/JTAG controller

upload_speed = 921600
monitor_speed = 115200
monitor_filters = send_on_enter, time
monitor_echo = yes
monitor_eol = CR
