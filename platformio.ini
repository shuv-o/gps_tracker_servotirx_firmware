; =============================================================================
;  Fleet Tracker firmware - ESP32-S3-WROOM-1U-N16R8 + SIMCom A7672SA + TCAN4550
;
;  Environments
;    fleet_tracker : production firmware (src/ except src/test_fw)
;    modem_test    : bench test for the SIMCom modem (src/test_fw only)
;
;  Build / flash:   pio run -e fleet_tracker -t upload
;  Monitor:         pio device monitor
; =============================================================================

[platformio]
default_envs = fleet_tracker

[common]
; PINNED: the firmware is tested on platform 7.0.1 = Arduino-ESP32 2.0.17 (ESP-IDF 4.4).
; Do not change without re-testing: espressif32 8.x ships Arduino core 3.x / IDF 5.
platform = platformio/espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
; nvs | otadata | app0 6.25MB | app1 6.25MB | spiffs (LittleFS) 3.4MB | coredump
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
monitor_filters = send_on_enter, time, esp32_exception_decoder
monitor_echo = yes
monitor_eol = CR
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

[env:fleet_tracker]
extends = common
build_src_filter = +<*> -<test_fw/>
build_flags =
    ${common.build_flags}
    -Iinclude
    -Isrc
build_src_flags = -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers
lib_deps = bblanchon/ArduinoJson@^7.2.1

[env:modem_test]
extends = common
build_src_filter = +<test_fw/>
